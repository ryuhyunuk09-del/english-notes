<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영어 지문 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f7;
  --surface:#ffffff;
  --paper:#fffdf8;
  --paper-edge:#ece4d3;
  --ink:#151b28;
  --ink-soft:#5a6478;
  --ink-faint:#8d96a8;
  --line:#dee3ed;
  --marker:#ffd45e;
  --marker-hl:rgba(255,212,94,.62);
  --marker-hl-on:rgba(255,196,20,.85);
  --teal:#0e7c6b;
  --rose:#c0453f;
  --r:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}

/* 읽기 모드에서는 편집 요소를 감춥니다 */
body:not(.can-edit) .edit-only{display:none!important;}

.wrap{display:flex;min-height:100vh;}
.side{
  width:292px;flex:0 0 292px;background:var(--surface);
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.main{flex:1;min-width:0;padding:34px 40px 90px;}

.brand{padding:22px 20px 16px;border-bottom:1px solid var(--line);}
.brand h1{margin:0;font-family:'Literata',Georgia,serif;font-size:19px;font-weight:600;letter-spacing:-.01em;}
.brand .sub{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin-top:5px;}

.side-tools{padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px;}
.search{width:100%;padding:9px 12px;border-radius:8px;background:#f4f6fa;border:1px solid var(--line);outline:none;}
.search:focus{border-color:var(--marker);background:#fff;}
.search::placeholder{color:var(--ink-faint);}
.tagbar{display:flex;flex-wrap:wrap;gap:5px;}
.tag{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:3px 9px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--ink-soft);}
.tag:hover{border-color:var(--ink-faint);color:var(--ink);}
.tag.on{background:var(--marker);border-color:var(--marker);color:#3d2c00;font-weight:500;}

.plist{flex:1;overflow-y:auto;padding:8px 10px 16px;}
.pitem{width:100%;text-align:left;background:transparent;border:0;padding:11px 12px;border-radius:var(--r);margin-bottom:2px;border-left:2px solid transparent;}
.pitem:hover{background:#f2f5fa;}
.pitem.on{background:#f4f6fb;border-left-color:var(--marker);}
.pitem .t{font-size:14px;font-weight:500;line-height:1.35;}
.pitem .m{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-faint);margin-top:4px;letter-spacing:.04em;}

.side-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;}

.btn{padding:9px 15px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13px;}
.btn:hover{background:#f2f5fa;}
.btn-fill{background:var(--marker);border-color:var(--marker);color:#3d2c00;font-weight:500;}
.btn-fill:hover{background:#ffc42a;}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-soft);}
.btn-ghost:hover{color:var(--ink);background:#f2f5fa;}
.btn-key.on{background:var(--teal);border-color:var(--teal);color:#fff;}

.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:20px;}
.phead h2{margin:0;font-family:'Literata',Georgia,serif;font-size:28px;font-weight:600;letter-spacing:-.015em;line-height:1.25;}
.meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.meta .chip{padding:2px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;}
.acts{display:flex;gap:7px;flex-shrink:0;}

.paper{
  background:var(--paper);border:1px solid var(--paper-edge);border-radius:14px;
  padding:34px 38px;box-shadow:0 10px 26px rgba(30,45,80,.07);
  font-family:'Literata',Georgia,serif;font-size:16.5px;line-height:1.95;
  white-space:pre-wrap;word-break:break-word;
}
mark.hl{
  background:linear-gradient(to bottom,transparent 8%,var(--marker-hl) 8%,var(--marker-hl) 88%,transparent 88%);
  color:inherit;font-weight:600;padding:0 1px;border-radius:2px;cursor:pointer;
}
mark.hl:hover{background:linear-gradient(to bottom,transparent 8%,var(--marker-hl-on) 8%,var(--marker-hl-on) 88%,transparent 88%);}

.sec{margin-top:34px;}
.sec-head{display:flex;align-items:center;gap:10px;padding-bottom:10px;margin-bottom:14px;border-bottom:1px solid var(--line);}
.sec-head .lbl{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);}
.sec-head .n{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--teal);}
.sec-head .sp{flex:1;}

.entry{display:flex;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line);border-radius:6px;}
.entry:last-child{border-bottom:0;}
.entry.flash{animation:flash 1.4s ease;}
@keyframes flash{0%{background:rgba(255,212,94,.5);}100%{background:transparent;}}
.entry .body{flex:1;min-width:0;}
.term{font-family:'Literata',Georgia,serif;font-size:17px;font-weight:600;}
.pos{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--teal);margin-left:8px;}
.mean{margin-top:2px;color:var(--ink);}
.ex{font-family:'Literata',Georgia,serif;font-style:italic;color:var(--ink-soft);font-size:14.5px;margin-top:6px;padding-left:11px;border-left:2px solid rgba(14,124,107,.35);}
.trans-block{
  margin-top:24px;padding-top:18px;border-top:1px dashed var(--paper-edge);
  font-family:'Noto Sans KR',sans-serif;font-size:14.5px;line-height:1.9;
  color:#645c50;white-space:pre-wrap;
}
.trans-block .lead{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:#a2957f;display:block;margin-bottom:10px;
}
.btn-tr.on{background:var(--marker);border-color:var(--marker);color:#3d2c00;font-weight:500;}

/* 뜻 목록 */
.senses{margin-top:6px;display:flex;flex-direction:column;gap:8px;}
.sense{display:flex;gap:9px;align-items:flex-start;padding:5px 8px;border-radius:7px;}
.sense.used{background:rgba(255,212,94,.20);box-shadow:inset 2px 0 0 var(--marker);}
.sense .num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint);padding-top:3px;min-width:16px;}
.sense.used .num{color:#8a6b00;font-weight:500;}
.sense .txt{flex:1;min-width:0;}
.used-tag{
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;
  background:var(--marker);color:#3d2c00;padding:2px 7px;border-radius:999px;
  margin-left:8px;vertical-align:2px;white-space:nowrap;
}

/* 뜻 입력 줄 */
.sense-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.sense-row .pick{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-soft);white-space:nowrap;font-family:'IBM Plex Mono',monospace;}
.sense-row .s-m{flex:0 0 34%;}
.sense-row .s-ex{flex:1;}

.g-title{font-size:15px;font-weight:700;}
.g-title .badge{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:400;color:#fff;background:var(--teal);padding:2px 7px;border-radius:4px;margin-right:9px;vertical-align:2px;}
.row-acts{display:flex;gap:2px;align-items:flex-start;}
.ico{background:transparent;border:0;color:var(--ink-faint);padding:4px 7px;border-radius:6px;font-size:13px;line-height:1;}
.ico:hover{background:#f0f3f8;color:var(--ink);}
.ico.del:hover{color:var(--rose);}

.form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;display:none;}
.form.open{display:block;}
.grid{display:grid;gap:10px;}
.g3{grid-template-columns:1.1fr .5fr 1.4fr;}
.g2{grid-template-columns:1fr 1fr;}
.g1{grid-template-columns:1fr;}
.fld{display:flex;flex-direction:column;gap:5px;}
.fld label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);}
.in{width:100%;padding:9px 11px;border-radius:8px;background:#f7f9fc;border:1px solid var(--line);outline:none;}
.in:focus{border-color:var(--marker);background:#fff;}
.in::placeholder{color:#a8b0c0;}
textarea.in{resize:vertical;min-height:90px;line-height:1.7;}
.form-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--ink-faint);font-size:14px;background:#fff;}

.veil{display:none;position:fixed;inset:0;background:rgba(21,27,40,.45);z-index:50;padding:28px;overflow-y:auto;}
.veil.open{display:block;}
.modal{max-width:720px;margin:24px auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;box-shadow:0 24px 60px rgba(21,27,40,.22);}
.modal h3{margin:0 0 6px;font-family:'Literata',Georgia,serif;font-size:20px;font-weight:600;}
.modal .hint{color:var(--ink-soft);font-size:13px;margin:0 0 18px;line-height:1.65;}
.modal .hint a{color:var(--teal);}
.modal .hint code{background:#f0f3f8;padding:1px 5px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:12px;}

.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,80px);background:var(--ink);color:#fff;font-size:13px;padding:10px 20px;border-radius:999px;opacity:0;transition:.28s ease;z-index:80;pointer-events:none;max-width:88vw;text-align:center;}
.toast.show{opacity:1;transform:translate(-50%,0);}

.status{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-faint);
  padding:0 16px 12px;
}
.status b{color:var(--teal);font-weight:500;}

.mobile-bar{display:none;}
@media (max-width:860px){
  .wrap{flex-direction:column;}
  .side{position:static;width:100%;flex:none;height:auto;border-right:0;border-bottom:1px solid var(--line);}
  .side.collapsed .side-tools,.side.collapsed .plist,.side.collapsed .side-foot,.side.collapsed .status{display:none;}
  .plist{max-height:46vh;}
  .main{padding:22px 18px 70px;}
  .paper{padding:24px 20px;font-size:16px;line-height:1.9;}
  .phead{flex-direction:column;gap:12px;}
  .phead h2{font-size:23px;}
  .g3,.g2{grid-template-columns:1fr;}
  .mobile-bar{display:block;}
  .veil{padding:0;}
  .modal{margin:0;border-radius:0;min-height:100vh;}
}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>

<div class="wrap">
  <aside class="side" id="side">
    <div class="brand">
      <h1>영어 지문 노트</h1>
      <div class="sub">Passages · Words · Grammar</div>
      <button class="btn btn-sm mobile-bar" id="toggleSide" style="margin-top:12px;">목록 접기</button>
    </div>

    <div class="side-tools">
      <input class="search" id="search" placeholder="지문 · 단어 검색">
      <div class="tagbar" id="tagbar"></div>
    </div>

    <div class="plist" id="plist"></div>

    <div class="status" id="status"></div>

    <div class="side-foot">
      <button class="btn btn-sm btn-fill edit-only" id="newBtn" style="flex:1;">+ 지문 추가</button>
      <button class="btn btn-sm btn-key" id="keyBtn" title="편집 권한">🔒 편집</button>
      <button class="btn btn-sm" id="exportBtn" title="JSON 내려받기">↓</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<!-- 지문 모달 -->
<div class="veil" id="veil">
  <div class="modal">
    <h3 id="modalTitle">지문 추가</h3>
    <div class="grid g1">
      <div class="fld"><label>제목</label><input class="in" id="fTitle" placeholder="예) 사회 규범과 개인의 선택"></div>
      <div class="grid g2">
        <div class="fld"><label>출처</label><input class="in" id="fSource" placeholder="예) 2026 고2 모의고사 32번"></div>
        <div class="fld"><label>태그 (쉼표로 구분)</label><input class="in" id="fTags" placeholder="예) 모의고사, 사회"></div>
      </div>
      <div class="fld"><label>지문</label><textarea class="in" id="fBody" rows="12" placeholder="영어 지문을 붙여넣으세요"></textarea></div>
      <div class="fld"><label>해석</label><textarea class="in" id="fTrans" rows="8" placeholder="지문 전체 해석을 적으세요"></textarea></div>
    </div>
    <div class="form-foot">
      <button class="btn" id="mCancel">취소</button>
      <button class="btn btn-fill" id="mSave">저장</button>
    </div>
  </div>
</div>

<!-- 편집 권한 모달 -->
<div class="veil" id="keyVeil">
  <div class="modal">
    <h3>편집 권한 열기</h3>
    <p class="hint">
      GitHub 토큰을 넣으면 편집 모드가 열리고, 수정한 내용이 저장소의 <code>data.json</code>에 바로 커밋됩니다.
      토큰은 이 브라우저에만 남고 사이트에는 올라가지 않습니다. 방문자는 읽기만 할 수 있습니다.
    </p>
    <div class="grid g1">
      <div class="grid g2">
        <div class="fld"><label>GitHub 아이디</label><input class="in" id="kOwner" placeholder="your-id"></div>
        <div class="fld"><label>저장소 이름</label><input class="in" id="kRepo" placeholder="english-notes"></div>
      </div>
      <div class="grid g2">
        <div class="fld"><label>브랜치</label><input class="in" id="kBranch" placeholder="main"></div>
        <div class="fld"><label>저장소 내 경로</label><input class="in" id="kPath" placeholder="data.json"></div>
      </div>
      <div class="fld"><label>Access token</label><input class="in" id="kToken" type="password" placeholder="github_pat_..."></div>
      <label style="display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-soft);">
        <input type="checkbox" id="kRemember" checked> 이 브라우저에 기억하기
      </label>
    </div>
    <div class="form-foot">
      <button class="btn btn-ghost" id="kForget" style="margin-right:auto;">권한 끄기</button>
      <button class="btn" id="kCancel">취소</button>
      <button class="btn btn-fill" id="kSave">확인</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= state ================= */
let DB = { passages: [] };
let CFG = { owner:'', repo:'', branch:'main', path:'data.json', token:'' };
let fileSha = null;
let canEdit = false;
let currentId = null, editingPassageId = null, editWordIdx = null, editGramIdx = null;
let query = '', activeTag = null, showTrans = false;

const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ================= 로컬 설정 (토큰 보관) ================= */
function readCfg(){
  try{
    const raw = window.localStorage.getItem('en-notes-cfg');
    if (raw) Object.assign(CFG, JSON.parse(raw));
  }catch(e){/* 저장소 사용 불가 — 세션 동안만 유지 */}
}
function writeCfg(remember){
  try{
    if (remember) window.localStorage.setItem('en-notes-cfg', JSON.stringify(CFG));
    else window.localStorage.removeItem('en-notes-cfg');
  }catch(e){/* 무시 */}
}

/* ================= 유틸 ================= */
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rxEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

function b64encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000));
  return btoa(bin);
}
function b64decode(b64){
  const bin = atob(b64.replace(/\s/g,''));
  const bytes = Uint8Array.from(bin, c=>c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

let toastTimer = null;
function toast(msg){
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* ================= 데이터 읽기 ================= */
async function loadData(){
  // 같은 폴더의 data.json 을 읽습니다 (방문자도 여기서 읽습니다).
  // 저장소 안 하위 폴더에 두어도 상대경로라 그대로 동작합니다.
  try{
    const r = await fetch('./data.json?v=' + Date.now(), {cache:'no-store'});
    if (r.ok){
      const d = await r.json();
      if (d && Array.isArray(d.passages)) { DB = d; return true; }
    }
  }catch(e){/* 아직 파일이 없을 수 있습니다 */}
  return false;
}

/* 커밋에 필요한 현재 sha 확인 */
async function fetchSha(){
  if (!CFG.token || !CFG.owner || !CFG.repo) return null;
  try{
    const r = await fetch(api(), {headers: ghHeaders()});
    if (r.status === 404) { fileSha = null; return null; }
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    fileSha = j.sha;
    return j.sha;
  }catch(e){ return null; }
}
function api(){
  return `https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${CFG.path}` +
         (CFG.branch ? `?ref=${encodeURIComponent(CFG.branch)}` : '');
}
function ghHeaders(){
  return {
    'Authorization': 'Bearer ' + CFG.token,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  };
}

/* ================= 저장 (GitHub 커밋) ================= */
let saveTimer = null, saving = false;
function save(msg){
  if (!canEdit) return;
  setStatus('저장 대기…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>commit(msg), 900);
}
async function commit(msg){
  if (saving) { save(msg); return; }
  saving = true;
  setStatus('저장 중…');
  try{
    if (fileSha === null) await fetchSha();
    const url = `https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${CFG.path}`;
    const body = {
      message: msg || ('노트 업데이트 ' + new Date().toLocaleString('ko-KR')),
      content: b64encode(JSON.stringify(DB, null, 2)),
      branch: CFG.branch || 'main'
    };
    if (fileSha) body.sha = fileSha;

    let r = await fetch(url, {method:'PUT', headers:{...ghHeaders(),'Content-Type':'application/json'}, body:JSON.stringify(body)});

    if (r.status === 409 || r.status === 422){   // 다른 곳에서 먼저 바뀐 경우
      await fetchSha();
      if (fileSha) body.sha = fileSha;
      r = await fetch(url, {method:'PUT', headers:{...ghHeaders(),'Content-Type':'application/json'}, body:JSON.stringify(body)});
    }
    if (!r.ok){
      const t = await r.text();
      throw new Error(r.status + ' ' + t.slice(0,120));
    }
    const j = await r.json();
    fileSha = j.content && j.content.sha;
    setStatus('저장됨 · ' + new Date().toLocaleTimeString('ko-KR'));
  }catch(e){
    setStatus('저장 실패');
    toast('저장 실패 — 토큰과 저장소 설정을 확인하세요 (' + e.message + ')');
  }finally{ saving = false; }
}
function setStatus(s){
  $('status').innerHTML = canEdit
    ? `<b>편집 모드</b> · ${esc(CFG.owner)}/${esc(CFG.repo)} · ${esc(s)}`
    : '읽기 모드 · 편집하려면 🔒 를 누르세요';
}

/* ================= 지문 렌더 ================= */
function renderPassageBody(p){
  const terms = (p.words||[]).map((w,i)=>({t:(w.term||'').trim(), i}))
    .filter(o=>o.t.length>0).sort((a,b)=>b.t.length-a.t.length);
  if (!terms.length) return esc(p.body);

  const parts = terms.map(o=>{
    const base = rxEsc(o.t);
    return /\s/.test(o.t) ? base : base + '(?:s|es|ed|ing|d|ies|ly)?';
  });
  const re = new RegExp('(?<![\\w-])(' + parts.join('|') + ')(?![\\w-])','gi');

  let out='', last=0, m;
  while ((m = re.exec(p.body)) !== null){
    const hit = m[0].toLowerCase();
    let idx = terms.findIndex(o=>hit === o.t.toLowerCase());
    if (idx === -1) idx = terms.findIndex(o=>hit.startsWith(o.t.toLowerCase()));
    out += esc(p.body.slice(last, m.index));
    out += '<mark class="hl" data-w="'+terms[Math.max(idx,0)].i+'">'+esc(m[0])+'</mark>';
    last = m.index + m[0].length;
    if (m.index === re.lastIndex) re.lastIndex++;
  }
  out += esc(p.body.slice(last));
  return out;
}

function allTags(){
  const s = new Set();
  DB.passages.forEach(p=>(p.tags||[]).forEach(t=>s.add(t)));
  return [...s].sort();
}
function filtered(){
  const q = query.trim().toLowerCase();
  return DB.passages.filter(p=>{
    if (activeTag && !(p.tags||[]).includes(activeTag)) return false;
    if (!q) return true;
    if ((p.title||'').toLowerCase().includes(q)) return true;
    if ((p.body||'').toLowerCase().includes(q)) return true;
    if ((p.source||'').toLowerCase().includes(q)) return true;
    if ((p.words||[]).some(w=>
      (w.term||'').toLowerCase().includes(q) ||
      senses(w).some(s=>(s.meaning||'').toLowerCase().includes(q))
    )) return true;
    if ((p.grammars||[]).some(g=>(g.title||'').toLowerCase().includes(q))) return true;
    return false;
  });
}

function renderSide(){
  const tb = $('tagbar');
  tb.innerHTML = allTags().map(t=>`<button class="tag${activeTag===t?' on':''}" data-tag="${esc(t)}">${esc(t)}</button>`).join('');
  tb.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{
    activeTag = activeTag===b.dataset.tag ? null : b.dataset.tag;
    renderSide();
  });
  renderList();
}
function renderList(){
  const list = filtered(), el = $('plist');
  if (!list.length){
    el.innerHTML = '<div style="padding:20px 12px;color:var(--ink-faint);font-size:13px;">'+
      (DB.passages.length ? '조건에 맞는 지문이 없습니다.' : '아직 지문이 없습니다.')+'</div>';
    return;
  }
  el.innerHTML = list.map(p=>`
    <button class="pitem${p.id===currentId?' on':''}" data-id="${p.id}">
      <div class="t">${esc(p.title||'제목 없음')}</div>
      <div class="m">단어 ${(p.words||[]).length} · 문법 ${(p.grammars||[]).length}${p.source?' · '+esc(p.source):''}</div>
    </button>`).join('');
  el.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{
    currentId = b.dataset.id; renderList(); renderMain();
    window.scrollTo({top:0,behavior:'smooth'});
  });
}

          <button class="btn btn-sm btn-ghost" id="delP">삭제</button>
        </span>

      p.trans?`<div class="trans-block" id="transBlock"${showTrans?'':' style="display:none;"'}><span class="lead">해석</span>${esc(p.trans)}</div>`:''
    }</div>

    <section class="sec">
      <div class="sec-head">
        <span class="lbl">Words</span><span class="n">${(p.words||[]).length}</span>
        <span class="sp"></span>
        <button class="btn btn-sm btn-fill edit-only" id="addWordBtn">+ 단어</button>
      </div>
      <div class="form" id="wordForm">
        <div class="grid g2">
          <div class="fld"><label>단어</label><input class="in" id="wTerm" placeholder="observe"></div>
          <div class="fld"><label>품사</label>
            <select class="in" id="wPos">
              <option value="n.">n. 명사</option><option value="v.">v. 동사</option>
              <option value="adj.">adj. 형용사</option><option value="adv.">adv. 부사</option>
              <option value="prep.">prep. 전치사</option><option value="conj.">conj. 접속사</option>

            </select>

        </div>
        <div class="fld" style="margin-top:12px;">
          <label>뜻 · 예문 &nbsp;— &nbsp;왼쪽 동그라미로 지문에서 쓰인 뜻을 고르세요</label>

        </div>

          <button class="btn btn-sm" id="wCancel">취소</button>
          <button class="btn btn-sm btn-fill" id="wSave">추가</button>
        </div>
      </div>
      <div id="wordList"></div>
    </section>

    <section class="sec">
      <div class="sec-head">
        <span class="lbl">Grammar</span><span class="n">${(p.grammars||[]).length}</span>
        <span class="sp"></span>
        <button class="btn btn-sm btn-fill edit-only" id="addGramBtn">+ 문법</button>
      </div>
      <div class="form" id="gramForm">
        <div class="grid g1">
          <div class="fld"><label>문법 포인트</label><input class="in" id="gTitle" placeholder="현재완료의 계속적 용법"></div>
          <div class="fld"><label>설명</label><textarea class="in" id="gNote" rows="3" placeholder="과거부터 현재까지 이어지는 상태 → have p.p."></textarea></div>
          <div class="fld"><label>지문 속 문장</label><input class="in" id="gEx" placeholder="assumptions that have long been taken for granted"></div>
        </div>
        <div class="form-foot">
          <button class="btn btn-sm" id="gCancel">취소</button>
          <button class="btn btn-sm btn-fill" id="gSave">추가</button>

  if (p.trans) $('trBtn').onclick = ()=>{
    showTrans = !showTrans;

    $('editP').onclick = ()=>openModal(p.id);
    $('delP').onclick = ()=>{
      if (!confirm('이 지문과 정리한 단어·문법을 모두 삭제할까요?')) return;
      DB.passages = DB.passages.filter(x=>x.id!==p.id);
      currentId = DB.passages[0] ? DB.passages[0].id : null;
      save('지문 삭제'); renderSide(); renderMain();
    };
    $('addWordBtn').onclick = ()=>{ editWordIdx=null; resetWordForm(); $('wordForm').classList.toggle('open'); $('wTerm').focus(); };
    $('addSense').onclick = ()=>{
      const c = collectSenses();
      c.list.push({meaning:'',example:''});
      drawSenseRows(c.list, c.used);
      const rows = $('senseRows').querySelectorAll('.s-m');
      rows[rows.length-1].focus();
    };
    $('wCancel').onclick = ()=>{ $('wordForm').classList.remove('open'); editWordIdx=null; };
    $('wSave').onclick = saveWord;
    $('addGramBtn').onclick = ()=>{ editGramIdx=null; resetGramForm(); $('gramForm').classList.toggle('open'); $('gTitle').focus(); };
    $('gCancel').onclick = ()=>{ $('gramForm').classList.remove('open'); editGramIdx=null; };
    $('gSave').onclick = saveGram;
  }

  $('paper').querySelectorAll('mark.hl').forEach(mk=>mk.onclick=()=>{
    const row = document.querySelector(`[data-word-row="${mk.dataset.w}"]`);
    if (!row) return;
    row.scrollIntoView({behavior:'smooth',block:'center'});
    row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash');
  });

  renderWords(); renderGrams();
}

function renderWords(){
  const p = DB.passages.find(x=>x.id===currentId), el = $('wordList');
  if (!(p.words||[]).length){
    el.innerHTML = '<div class="empty">추가한 단어는 지문에서 형광펜으로 표시됩니다.</div>';
    return;
  }
  el.innerHTML = p.words.map((w,i)=>{
    const ss = senses(w);
    const one = ss.length <= 1;
    return `
    <div class="entry" data-word-row="${i}">
      <div class="body">
        <div><span class="term">${esc(w.term)}</span>${w.pos?`<span class="pos">${esc(w.pos)}</span>`:''}</div>
        <div class="senses">
          ${ss.map((s,si)=>{
            const on = (w.used|0) === si && !one;
            return `<div class="sense${on?' used':''}">
              ${one?'':`<span class="num">${si+1}</span>`}
              <div class="txt">
                <div class="mean">${esc(s.meaning||'')}${on?'<span class="used-tag">지문에서 쓰임</span>':''}</div>
                ${s.example?`<div class="ex">${esc(s.example)}</div>`:''}
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>
      <div class="row-acts edit-only">
        <button class="ico" data-wedit="${i}" title="수정">✎</button>
        <button class="ico del" data-wdel="${i}" title="삭제">✕</button>
      </div>
    </div>`;}).join('');
  if (!canEdit) return;
  el.querySelectorAll('[data-wdel]').forEach(b=>b.onclick=()=>{
    p.words.splice(+b.dataset.wdel,1); save('단어 삭제'); renderSide(); renderMain();
  });
  el.querySelectorAll('[data-wedit]').forEach(b=>b.onclick=()=>{
    const i = +b.dataset.wedit, w = p.words[i];
    editWordIdx = i;
    $('wTerm').value=w.term||''; $('wPos').value=w.pos||'';
    drawSenseRows(senses(w), w.used|0);
    $('wSave').textContent='수정 저장';
    $('wordForm').classList.add('open');
    $('wordForm').scrollIntoView({behavior:'smooth',block:'center'});
  });
}

function renderGrams(){
  const p = DB.passages.find(x=>x.id===currentId), el = $('gramList');
  if (!(p.grammars||[]).length){
    el.innerHTML = '<div class="empty">이 지문에서 짚어둘 문법을 기록해 두세요.</div>';
    return;
  }
  el.innerHTML = p.grammars.map((g,i)=>`
    <div class="entry">
      <div class="body">
        <div class="g-title"><span class="badge">${String(i+1).padStart(2,'0')}</span>${esc(g.title)}</div>
        ${g.note?`<div class="mean" style="margin-top:6px;">${esc(g.note)}</div>`:''}
        ${g.example?`<div class="ex">${esc(g.example)}</div>`:''}
      </div>
      <div class="row-acts edit-only">
        <button class="ico" data-gedit="${i}" title="수정">✎</button>
        <button class="ico del" data-gdel="${i}" title="삭제">✕</button>
      </div>
    </div>`).join('');
  if (!canEdit) return;
  el.querySelectorAll('[data-gdel]').forEach(b=>b.onclick=()=>{
    p.grammars.splice(+b.dataset.gdel,1); save('문법 삭제'); renderSide(); renderMain();
  });
  el.querySelectorAll('[data-gedit]').forEach(b=>b.onclick=()=>{
    const i = +b.dataset.gedit, g = p.grammars[i];
    editGramIdx = i;
    $('gTitle').value=g.title||''; $('gNote').value=g.note||''; $('gEx').value=g.example||'';
    $('gSave').textContent='수정 저장';
    $('gramForm').classList.add('open');
    $('gramForm').scrollIntoView({behavior:'smooth',block:'center'});
  });
}

/* 예전 형식({meaning, example})도 그대로 읽히도록 맞춰 줍니다 */
function senses(w){
  if (Array.isArray(w.senses) && w.senses.length) return w.senses;
  return [{meaning:w.meaning||'', example:w.example||''}];
}

function drawSenseRows(list, used){
  const box = $('senseRows');
  box.innerHTML = list.map((s,i)=>`
    <div class="sense-row">
      <label class="pick" title="지문에서 쓰인 뜻">
        <input type="radio" name="usedSense" value="${i}"${used===i?' checked':''}>
      </label>
      <input class="in s-m" placeholder="뜻" value="${esc(s.meaning||'')}">
      <input class="in s-ex" placeholder="예문" value="${esc(s.example||'')}">
      <button class="ico del s-del" title="이 뜻 지우기">✕</button>
    </div>`).join('');
  box.querySelectorAll('.s-del').forEach((b,i)=>b.onclick=()=>{
    const cur = collectSenses();
    if (cur.list.length <= 1) { drawSenseRows([{meaning:'',example:''}], 0); return; }
    cur.list.splice(i,1);
    drawSenseRows(cur.list, Math.min(cur.used, cur.list.length-1));
  });
}
function collectSenses(){
  const rows = [...$('senseRows').querySelectorAll('.sense-row')];
  const list = rows.map(r=>({
    meaning: r.querySelector('.s-m').value.trim(),
    example: r.querySelector('.s-ex').value.trim()
  }));
  let used = rows.findIndex(r=>r.querySelector('input[type=radio]').checked);
  if (used < 0) used = 0;
  return {list, used};
}

function resetWordForm(){
  $('wTerm').value=''; $('wPos').value='n.';
  drawSenseRows([{meaning:'',example:''}], 0);
  $('wSave').textContent='추가';
}
function resetGramForm(){ $('gTitle').value=''; $('gNote').value=''; $('gEx').value=''; $('gSave').textContent='추가'; }

function saveWord(){
  const p = DB.passages.find(x=>x.id===currentId);
  const term = $('wTerm').value.trim();
  if (!term){ toast('단어를 입력하세요'); $('wTerm').focus(); return; }
  const c = collectSenses();
  const list = c.list.filter(s=>s.meaning || s.example);
  if (!list.length){ toast('뜻을 하나 이상 입력하세요'); return; }
  const item = {term, pos:$('wPos').value, senses:list, used:Math.min(c.used, list.length-1)};
  p.words = p.words||[];
  if (editWordIdx!==null) p.words[editWordIdx]=item; else p.words.push(item);
  editWordIdx = null;
  save('단어 추가: '+term); renderSide(); renderMain();
}
function saveGram(){
  const p = DB.passages.find(x=>x.id===currentId);
  const title = $('gTitle').value.trim();
  if (!title){ toast('문법 포인트를 입력하세요'); $('gTitle').focus(); return; }
  const item = {title, note:$('gNote').value.trim(), example:$('gEx').value.trim()};
  p.grammars = p.grammars||[];
  if (editGramIdx!==null) p.grammars[editGramIdx]=item; else p.grammars.push(item);
  editGramIdx = null;
  save('문법 추가'); renderSide(); renderMain();
}

/* ================= 지문 모달 ================= */
function openModal(id){
  editingPassageId = id||null;
  const p = id ? DB.passages.find(x=>x.id===id) : null;
  $('modalTitle').textContent = p ? '지문 수정' : '지문 추가';
  $('fTitle').value = p?p.title:''; $('fSource').value = p?(p.source||''):'';
  $('fTags').value = p?(p.tags||[]).join(', '):''; $('fBody').value = p?p.body:'';
  $('fTrans').value = p?(p.trans||''):'';
  $('veil').classList.add('open');
  setTimeout(()=>$('fTitle').focus(),60);
}
function closeModal(){ $('veil').classList.remove('open'); editingPassageId=null; }
$('mCancel').onclick = closeModal;
$('veil').onclick = e=>{ if (e.target===$('veil')) closeModal(); };
$('mSave').onclick = ()=>{
  const title = $('fTitle').value.trim(), body = $('fBody').value.trim();
  if (!body){ toast('지문을 입력하세요'); $('fBody').focus(); return; }
  const tags = $('fTags').value.split(',').map(s=>s.trim()).filter(Boolean);
  const trans = $('fTrans').value.trim();
  if (editingPassageId){
    const p = DB.passages.find(x=>x.id===editingPassageId);
    Object.assign(p,{title:title||p.title, source:$('fSource').value.trim(), tags, body, trans});
  }else{
    const p = {id:uid(), title:title||'제목 없음', source:$('fSource').value.trim(), tags, body, trans, words:[], grammars:[], createdAt:Date.now()};
    DB.passages.unshift(p); currentId = p.id;
  }
  closeModal(); save(title?('지문 저장: '+title):'지문 저장'); renderSide(); renderMain();
};

/* ================= 편집 권한 ================= */
function openKey(){
  $('kOwner').value = CFG.owner; $('kRepo').value = CFG.repo;
  $('kBranch').value = CFG.branch||'main'; $('kPath').value = CFG.path||'data.json';
  $('kToken').value = CFG.token;
  $('keyVeil').classList.add('open');
}
function closeKey(){ $('keyVeil').classList.remove('open'); }
$('keyBtn').onclick = openKey;
$('kCancel').onclick = closeKey;
$('keyVeil').onclick = e=>{ if (e.target===$('keyVeil')) closeKey(); };
$('kForget').onclick = ()=>{
  CFG.token=''; writeCfg(false); canEdit=false;
  document.body.classList.remove('can-edit');
  $('keyBtn').classList.remove('on'); $('keyBtn').textContent='🔒 편집';
  closeKey(); setStatus(''); renderMain(); toast('편집 권한을 껐습니다');
};
$('kSave').onclick = async ()=>{
  CFG.owner=$('kOwner').value.trim(); CFG.repo=$('kRepo').value.trim();
  CFG.branch=$('kBranch').value.trim()||'main'; CFG.path=$('kPath').value.trim()||'data.json';
  CFG.token=$('kToken').value.trim();
  if (!CFG.owner||!CFG.repo||!CFG.token){ toast('아이디 · 저장소 · 토큰을 모두 입력하세요'); return; }
  toast('확인 중…');
  const ok = await verify();
  if (!ok){ toast('접근할 수 없습니다. 토큰 권한(Contents: Read and write)을 확인하세요'); return; }
  writeCfg($('kRemember').checked);
  canEdit = true;
  document.body.classList.add('can-edit');
  $('keyBtn').classList.add('on'); $('keyBtn').textContent='🔓 편집 중';
  closeKey(); setStatus('연결됨'); renderSide(); renderMain();
};
async function verify(){
  try{
    const r = await fetch(`https://api.github.com/repos/${CFG.owner}/${CFG.repo}`, {headers:ghHeaders()});
    if (!r.ok) return false;
    const j = await r.json();
    if (!j.permissions || !j.permissions.push) return false;
    await fetchSha();
    return true;
  }catch(e){ return false; }
}

/* ================= 내보내기 ================= */
$('exportBtn').onclick = ()=>{
  const blob = new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'data.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('data.json 을 내려받았습니다');
};

/* ================= 기타 ================= */
$('newBtn').onclick = ()=>openModal(null);
$('search').oninput = e=>{ query=e.target.value; renderList(); };
$('toggleSide').onclick = ()=>{
  const s = $('side'); s.classList.toggle('collapsed');
  $('toggleSide').textContent = s.classList.contains('collapsed')?'목록 펼치기':'목록 접기';
};
document.addEventListener('keydown', e=>{ if (e.key==='Escape'){ closeModal(); closeKey(); } });

/* ================= 시작 ================= */
(async function init(){
  readCfg();
  await loadData();
  if (CFG.token && CFG.owner && CFG.repo){
    canEdit = await verify();
    if (canEdit){
      document.body.classList.add('can-edit');
      $('keyBtn').classList.add('on'); $('keyBtn').textContent='🔓 편집 중';
    }
  }
  if (!DB.passages.length && canEdit) toast('첫 지문을 추가해 보세요');
  currentId = DB.passages[0] ? DB.passages[0].id : null;
  setStatus('연결됨');
  renderSide(); renderMain();
})();
</script>
