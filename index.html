<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영어 지문 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f7; --surface:#ffffff; --paper:#fffdf8; --paper-edge:#ece4d3;
  --ink:#151b28; --ink-soft:#5a6478; --ink-faint:#8d96a8; --line:#dee3ed;
  --marker:#ffd45e; --marker-hl:rgba(255,212,94,.62); --marker-hl-on:rgba(255,196,20,.85);
  --teal:#0e7c6b; --rose:#c0453f; --r:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
body:not(.can-edit) .edit-only{display:none!important;}

.wrap{display:flex;min-height:100vh;}
.side{width:292px;flex:0 0 292px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.main{flex:1;min-width:0;padding:34px 40px 90px;}

.brand{padding:22px 20px 16px;border-bottom:1px solid var(--line);}
.brand h1{margin:0;font-family:'Literata',Georgia,serif;font-size:19px;font-weight:600;letter-spacing:-.01em;}
.brand .sub{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin-top:5px;}
.nav{display:flex;gap:6px;margin-top:12px;}
.nav a{
  font-size:12.5px;text-decoration:none;padding:6px 12px;border-radius:7px;
  border:1px solid var(--line);color:var(--ink-soft);background:#fff;
}
.nav a.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500;}
.nav a:hover:not(.on){background:#f2f5fa;color:var(--ink);}

.side-tools{padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px;}
.search{width:100%;padding:9px 12px;border-radius:8px;background:#f4f6fa;border:1px solid var(--line);outline:none;}
.search:focus{border-color:var(--marker);background:#fff;}
.search::placeholder{color:var(--ink-faint);}
.tagbar{display:flex;flex-wrap:wrap;gap:5px;}
.tag{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:3px 9px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--ink-soft);}
.tag:hover{border-color:var(--ink-faint);color:var(--ink);}
.tag.on{background:var(--marker);border-color:var(--marker);color:#3d2c00;font-weight:500;}

.plist{flex:1;overflow-y:auto;padding:8px 10px 16px;}
.pitem{width:100%;text-align:left;background:transparent;border:0;padding:11px 12px;border-radius:var(--r);margin-bottom:2px;border-left:2px solid transparent;}
.pitem:hover{background:#f2f5fa;}
.pitem.on{background:#f4f6fb;border-left-color:var(--marker);}
.pitem .t{font-size:14px;font-weight:500;line-height:1.35;}
.pitem .m{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-faint);margin-top:4px;letter-spacing:.04em;}

.side-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;}
.btn{padding:9px 15px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13px;}
.btn:hover{background:#f2f5fa;}
.btn-fill{background:var(--marker);border-color:var(--marker);color:#3d2c00;font-weight:500;}
.btn-fill:hover{background:#ffc42a;}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-soft);}
.btn-ghost:hover{color:var(--ink);background:#f2f5fa;}
.btn-key.on,.btn-tr.on{background:var(--marker);border-color:var(--marker);color:#3d2c00;font-weight:500;}
.btn-ans.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:500;}

.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:20px;}
.phead h2{margin:0;font-family:'Literata',Georgia,serif;font-size:28px;font-weight:600;letter-spacing:-.015em;line-height:1.25;}
.meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.meta .chip{padding:2px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;}
.acts{display:flex;gap:7px;flex-shrink:0;flex-wrap:wrap;}

.paper{background:var(--paper);border:1px solid var(--paper-edge);border-radius:14px;padding:34px 38px;box-shadow:0 10px 26px rgba(30,45,80,.07);font-family:'Literata',Georgia,serif;font-size:16.5px;line-height:1.95;white-space:pre-wrap;word-break:break-word;}
mark.hl{background:linear-gradient(to bottom,transparent 8%,var(--marker-hl) 8%,var(--marker-hl) 88%,transparent 88%);color:inherit;font-weight:600;padding:0 1px;border-radius:2px;cursor:pointer;}
mark.hl:hover{background:linear-gradient(to bottom,transparent 8%,var(--marker-hl-on) 8%,var(--marker-hl-on) 88%,transparent 88%);}
.trans-block{margin-top:24px;padding-top:18px;border-top:1px dashed var(--paper-edge);font-family:'Noto Sans KR',sans-serif;font-size:14.5px;line-height:1.9;color:#645c50;white-space:pre-wrap;}
.trans-block .lead{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#a2957f;display:block;margin-bottom:10px;}

/* 문제 · 선지 */
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;}
.qtext{font-weight:500;margin-bottom:14px;white-space:pre-wrap;}
.choice{display:flex;gap:11px;padding:11px 12px;border-radius:9px;align-items:flex-start;}
.choice + .choice{margin-top:2px;}
.choice.ans{background:rgba(14,124,107,.10);box-shadow:inset 2px 0 0 var(--teal);}
.choice .cn{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-faint);padding-top:1px;min-width:18px;}
.choice.ans .cn{color:var(--teal);font-weight:500;}
.choice .ctext{flex:1;min-width:0;font-family:'Literata',Georgia,serif;font-size:15.5px;line-height:1.7;white-space:pre-wrap;}
.choice .ctr{font-family:'Noto Sans KR',sans-serif;font-size:13.5px;color:var(--ink-soft);margin-top:5px;padding-left:11px;border-left:2px solid rgba(255,196,20,.55);white-space:pre-wrap;}
.ans-tag{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;background:var(--teal);color:#fff;padding:2px 7px;border-radius:999px;margin-left:8px;vertical-align:2px;}

.sec{margin-top:34px;}
.sec-head{display:flex;align-items:center;gap:10px;padding-bottom:10px;margin-bottom:14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.sec-head .lbl{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);}
.sec-head .n{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--teal);}
.sec-head .sp{flex:1;}

.entry{display:flex;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line);border-radius:6px;}
.entry:last-child{border-bottom:0;}
.entry.flash{animation:flash 1.4s ease;}
@keyframes flash{0%{background:rgba(255,212,94,.5);}100%{background:transparent;}}
.entry .body{flex:1;min-width:0;}
.term{font-family:'Literata',Georgia,serif;font-size:17px;font-weight:600;}
.pos{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--teal);margin-left:8px;}
.mean{margin-top:2px;color:var(--ink);}
.ex{font-family:'Literata',Georgia,serif;font-style:italic;color:var(--ink-soft);font-size:14.5px;margin-top:6px;padding-left:11px;border-left:2px solid rgba(14,124,107,.35);}

.senses{margin-top:6px;display:flex;flex-direction:column;gap:8px;}
.sense{display:flex;gap:9px;align-items:flex-start;padding:5px 8px;border-radius:7px;}
.sense.used{background:rgba(255,212,94,.20);box-shadow:inset 2px 0 0 var(--marker);}
.sense .num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint);padding-top:3px;min-width:16px;}
.sense.used .num{color:#8a6b00;font-weight:500;}
.sense .txt{flex:1;min-width:0;}
.used-tag{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;background:var(--marker);color:#3d2c00;padding:2px 7px;border-radius:999px;margin-left:8px;vertical-align:2px;white-space:nowrap;}

/* 유의어 · 반의어 */
.rel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:9px;}
.rel .rl{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;color:var(--ink-faint);margin-right:2px;}
.wchip{
  font-family:'Literata',Georgia,serif;font-size:13.5px;
  padding:2px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;
}
.wchip.syn{border-color:rgba(14,124,107,.45);color:#0b6558;background:rgba(14,124,107,.07);}
.wchip.ant{border-color:rgba(192,69,63,.4);color:#a53c37;background:rgba(192,69,63,.06);}

.row-acts{display:flex;gap:2px;align-items:flex-start;}
.ico{background:transparent;border:0;color:var(--ink-faint);padding:4px 7px;border-radius:6px;font-size:13px;line-height:1;}
.ico:hover{background:#f0f3f8;color:var(--ink);}
.ico.del:hover{color:var(--rose);}

.form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;display:none;}
.form.open{display:block;}
.grid{display:grid;gap:10px;}
.g2{grid-template-columns:1fr 1fr;}
.g1{grid-template-columns:1fr;}
.fld{display:flex;flex-direction:column;gap:5px;}
.fld label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);}
.in{width:100%;padding:9px 11px;border-radius:8px;background:#f7f9fc;border:1px solid var(--line);outline:none;}
.in:focus{border-color:var(--marker);background:#fff;}
.in::placeholder{color:#a8b0c0;}
textarea.in{resize:vertical;min-height:80px;line-height:1.7;}
.form-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;}

.sense-row,.ch-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.sense-row .s-m{flex:0 0 34%;}
.sense-row .s-ex{flex:1;}
.ch-row .c-t{flex:1;}
.ch-row .c-tr{flex:1;}
.pick{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-soft);white-space:nowrap;font-family:'IBM Plex Mono',monospace;}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--ink-faint);font-size:14px;background:#fff;}

.veil{display:none;position:fixed;inset:0;background:rgba(21,27,40,.45);z-index:50;padding:28px;overflow-y:auto;}
.veil.open{display:block;}
.modal{max-width:760px;margin:24px auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;box-shadow:0 24px 60px rgba(21,27,40,.22);}
.modal h3{margin:0 0 6px;font-family:'Literata',Georgia,serif;font-size:20px;font-weight:600;}
.modal .hint{color:var(--ink-soft);font-size:13px;margin:0 0 18px;line-height:1.65;}
.modal .hint code{background:#f0f3f8;padding:1px 5px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:12px;}

.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,80px);background:var(--ink);color:#fff;font-size:13px;padding:10px 20px;border-radius:999px;opacity:0;transition:.28s ease;z-index:80;pointer-events:none;max-width:88vw;text-align:center;}
.toast.show{opacity:1;transform:translate(-50%,0);}
.status{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-faint);padding:0 16px 12px;}
.status b{color:var(--teal);font-weight:500;}

.mobile-bar{display:none;}
@media (max-width:860px){
  .wrap{flex-direction:column;}
  .side{position:static;width:100%;flex:none;height:auto;border-right:0;border-bottom:1px solid var(--line);}
  .side.collapsed .side-tools,.side.collapsed .plist,.side.collapsed .side-foot,.side.collapsed .status{display:none;}
  .plist{max-height:46vh;}
  .main{padding:22px 18px 70px;}
  .paper{padding:24px 20px;font-size:16px;line-height:1.9;}
  .qbox{padding:16px 14px;}
  .phead{flex-direction:column;gap:12px;}
  .phead h2{font-size:23px;}
  .g2{grid-template-columns:1fr;}
  .mobile-bar{display:block;}
  .veil{padding:0;}
  .modal{margin:0;border-radius:0;min-height:100vh;}
  .sense-row,.ch-row{
    flex-wrap:wrap;gap:6px;padding:10px;margin-bottom:10px;
    border:1px solid var(--line);border-radius:9px;background:#f7f9fc;
  }
  .sense-row .s-m,.sense-row .s-ex,.ch-row .c-t,.ch-row .c-tr{flex:1 1 100%;order:1;}
  .sense-row .s-ex,.ch-row .c-tr{order:2;}
  .sense-row .pick,.ch-row .pick{order:3;}
  .sense-row .pick::after{content:'지문에서 쓰인 뜻';}
  .ch-row .pick::after{content:'정답';}
  .s-del,.c-del{order:4;margin-left:auto;}
}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>

<div class="wrap">
  <aside class="side" id="side">
    <div class="brand">
      <h1>영어 지문 노트</h1>
      <div class="sub">Passages · Words</div>
      <div class="nav">
        <a href="./" class="on">지문</a>
        <a href="./grammar.html">문법</a>
      </div>
      <button class="btn btn-sm mobile-bar" id="toggleSide" style="margin-top:12px;">목록 접기</button>
    </div>

    <div class="side-tools">
      <input class="search" id="search" placeholder="지문 · 단어 검색">
      <div class="tagbar" id="tagbar"></div>
    </div>

    <div class="plist" id="plist"></div>
    <div class="status" id="status"></div>

    <div class="side-foot">
      <button class="btn btn-sm btn-fill edit-only" id="newBtn" style="flex:1;">+ 지문 추가</button>
      <button class="btn btn-sm btn-key" id="keyBtn" title="편집 권한">🔒 편집</button>
      <button class="btn btn-sm" id="exportBtn" title="JSON 내려받기">↓</button>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<!-- 지문 모달 -->
<div class="veil" id="veil">
  <div class="modal">
    <h3 id="modalTitle">지문 추가</h3>
    <div class="grid g1">
      <div class="fld"><label>제목</label><input class="in" id="fTitle" placeholder="예) 사회 규범과 개인의 선택"></div>
      <div class="grid g2">
        <div class="fld"><label>출처</label><input class="in" id="fSource" placeholder="예) 2026 고2 모의고사 32번"></div>
        <div class="fld"><label>태그 (쉼표로 구분)</label><input class="in" id="fTags" placeholder="예) 사회, 추상어휘"></div>
      </div>
      <div class="fld"><label>지문</label><textarea class="in" id="fBody" rows="11" placeholder="영어 지문을 붙여넣으세요"></textarea></div>
      <div class="fld"><label>해석</label><textarea class="in" id="fTrans" rows="6" placeholder="지문 전체 해석"></textarea></div>
      <div class="fld"><label>문제 발문 (없으면 비워두세요)</label><textarea class="in" id="fQ" rows="2" style="min-height:56px;" placeholder="예) 윗글의 요지로 가장 적절한 것은?"></textarea></div>
      <div class="fld">
        <label>선지 &nbsp;— &nbsp;왼쪽 동그라미로 정답을 고르세요</label>
        <div id="choiceRows"></div>
        <button class="btn btn-sm" id="addChoice" style="align-self:flex-start;">+ 선지 추가</button>
      </div>
    </div>
    <div class="form-foot">
      <button class="btn" id="mCancel">취소</button>
      <button class="btn btn-fill" id="mSave">저장</button>
    </div>
  </div>
</div>

<!-- 편집 권한 모달 -->
<div class="veil" id="keyVeil">
  <div class="modal">
    <h3>편집 권한 열기</h3>
    <p class="hint">GitHub 토큰을 넣으면 편집 모드가 열리고, 수정한 내용이 저장소의 <code>data.json</code>에 바로 커밋됩니다. 토큰은 이 브라우저에만 남습니다.</p>
    <div class="grid g1">
      <div class="grid g2">
        <div class="fld"><label>GitHub 아이디</label><input class="in" id="kOwner" placeholder="your-id"></div>
        <div class="fld"><label>저장소 이름</label><input class="in" id="kRepo" placeholder="english-notes"></div>
      </div>
      <div class="grid g2">
        <div class="fld"><label>브랜치</label><input class="in" id="kBranch" placeholder="main"></div>
        <div class="fld"><label>저장소 내 경로</label><input class="in" id="kPath" placeholder="data.json"></div>
      </div>
      <div class="fld"><label>Access token</label><input class="in" id="kToken" type="password" placeholder="github_pat_..."></div>
      <label style="display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-soft);">
        <input type="checkbox" id="kRemember" checked> 이 브라우저에 기억하기
      </label>
    </div>
    <div class="form-foot">
      <button class="btn btn-ghost" id="kForget" style="margin-right:auto;">권한 끄기</button>
      <button class="btn" id="kCancel">취소</button>
      <button class="btn btn-fill" id="kSave">확인</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= state ================= */
let DB = { passages: [] };
let CFG = { owner:'', repo:'', branch:'main', path:'data.json', token:'' };
let fileSha = null, canEdit = false;
let currentId = null, editingPassageId = null, editWordIdx = null;
let query = '', activeTag = null, showTrans = false, showCTrans = false, showAns = false;

const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const CIRC = ['①','②','③','④','⑤','⑥','⑦','⑧'];

/* ================= 설정 보관 ================= */
function readCfg(){
  try{ const raw = window.localStorage.getItem('en-notes-cfg'); if (raw) Object.assign(CFG, JSON.parse(raw)); }
  catch(e){}
}
function writeCfg(remember){
  try{ remember ? window.localStorage.setItem('en-notes-cfg', JSON.stringify(CFG))
                : window.localStorage.removeItem('en-notes-cfg'); }catch(e){}
}

/* ================= 유틸 ================= */
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rxEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const listOf = s => String(s||'').split(/[,،、]/).map(x=>x.trim()).filter(Boolean);

function b64encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin='';
  for (let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000));
  return btoa(bin);
}
let toastTimer=null;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2400);
}

/* ================= 데이터 ================= */
async function loadData(){
  try{
    const r = await fetch('./data.json?v='+Date.now(), {cache:'no-store'});
    if (r.ok){ const d = await r.json(); if (d && Array.isArray(d.passages)){ DB=d; return true; } }
  }catch(e){}
  return false;
}
function api(){
  return `https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${CFG.path}` +
         (CFG.branch?`?ref=${encodeURIComponent(CFG.branch)}`:'');
}
function ghHeaders(){
  return {'Authorization':'Bearer '+CFG.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
}
async function fetchSha(){
  if (!CFG.token||!CFG.owner||!CFG.repo) return null;
  try{
    const r = await fetch(api(), {headers:ghHeaders()});
    if (r.status===404){ fileSha=null; return null; }
    if (!r.ok) throw new Error(r.status);
    const j = await r.json(); fileSha=j.sha; return j.sha;
  }catch(e){ return null; }
}

let saveTimer=null, saving=false;
function save(msg){
  if (!canEdit) return;
  setStatus('저장 대기…');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>commit(msg),900);
}
async function commit(msg){
  if (saving){ save(msg); return; }
  saving=true; setStatus('저장 중…');
  try{
    if (fileSha===null) await fetchSha();
    const url = `https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${CFG.path}`;
    const body = {
      message: msg || ('노트 업데이트 '+new Date().toLocaleString('ko-KR')),
      content: b64encode(JSON.stringify(DB,null,2)),
      branch: CFG.branch||'main'
    };
    if (fileSha) body.sha=fileSha;
    let r = await fetch(url,{method:'PUT',headers:{...ghHeaders(),'Content-Type':'application/json'},body:JSON.stringify(body)});
    if (r.status===409||r.status===422){
      await fetchSha(); if (fileSha) body.sha=fileSha;
      r = await fetch(url,{method:'PUT',headers:{...ghHeaders(),'Content-Type':'application/json'},body:JSON.stringify(body)});
    }
    if (!r.ok){ const t=await r.text(); throw new Error(r.status+' '+t.slice(0,120)); }
    const j = await r.json(); fileSha = j.content && j.content.sha;
    setStatus('저장됨 · '+new Date().toLocaleTimeString('ko-KR'));
  }catch(e){
    setStatus('저장 실패');
    toast('저장 실패 — 토큰과 저장소 설정을 확인하세요 ('+e.message+')');
  }finally{ saving=false; }
}
function setStatus(s){
  $('status').innerHTML = canEdit
    ? `<b>편집 모드</b> · ${esc(CFG.owner)}/${esc(CFG.repo)} · ${esc(s)}`

}

/* ================= 단어 매칭 ================= */
/* 불규칙 변화형 — 양방향으로 이어 줍니다 */
const IRREG_SRC = {
  phenomenon:'phenomena', criterion:'criteria', datum:'data', medium:'media',
  bacterium:'bacteria', curriculum:'curricula', stimulus:'stimuli', nucleus:'nuclei',
  fungus:'fungi', radius:'radii', alumnus:'alumni', formula:'formulae',
  analysis:'analyses', basis:'bases', crisis:'crises', hypothesis:'hypotheses',
  thesis:'theses', diagnosis:'diagnoses', emphasis:'emphases', axis:'axes',
  index:'indices', matrix:'matrices', appendix:'appendices', vertex:'vertices',
  man:'men', woman:'women', child:'children', person:'people', foot:'feet',
  tooth:'teeth', goose:'geese', mouse:'mice', ox:'oxen',
  life:'lives', wife:'wives', knife:'knives', leaf:'leaves', half:'halves',
  shelf:'shelves', wolf:'wolves', thief:'thieves', self:'selves',
  be:'am is are was were been being', have:'has had having', do:'does did done doing',
  go:'went gone going', take:'took taken taking', give:'gave given giving',
  make:'made making', see:'saw seen seeing', know:'knew known knowing',
  think:'thought thinking', bring:'brought bringing', buy:'bought buying',
  catch:'caught catching', teach:'taught teaching', find:'found finding',
  hold:'held holding', keep:'kept keeping', leave:'left leaving',
  lose:'lost losing', mean:'meant meaning', meet:'met meeting', pay:'paid paying',
  say:'said saying', sell:'sold selling', send:'sent sending', sit:'sat sitting',
  speak:'spoke spoken speaking', stand:'stood standing', tell:'told telling',
  understand:'understood understanding', write:'wrote written writing',
  grow:'grew grown growing', draw:'drew drawn drawing', drive:'drove driven driving',
  eat:'ate eaten eating', fall:'fell fallen falling', feel:'felt feeling',
  get:'got gotten getting', hear:'heard hearing', run:'ran running',
  rise:'rose risen rising', choose:'chose chosen choosing',
  break:'broke broken breaking', become:'became becoming',
  begin:'began begun beginning', build:'built building', spend:'spent spending',
  win:'won winning', wear:'wore worn wearing', throw:'threw thrown throwing',
  seek:'sought seeking', deal:'dealt dealing', lead:'led leading',
  read:'reading', set:'setting', put:'putting', cut:'cutting',
  cost:'costing', let:'letting', hit:'hitting', hurt:'hurting', spread:'spreading'
};
const IRREG = (()=>{
  const m={};
  const add=(k,v)=>{ (m[k]=m[k]||new Set()).add(v); };
  for (const base in IRREG_SRC){
    IRREG_SRC[base].split(' ').forEach(f=>{ add(base,f); add(f,base);
      IRREG_SRC[base].split(' ').forEach(g=>{ if(g!==f) add(f,g); }); });
  }
  return m;
})();

/* 한 단어가 가질 수 있는 형태들 */
function wordForms(word){
  const t = word.toLowerCase().replace(/[^a-z'’-]/g,'');
  if (!t) return [];
  const s = new Set([t]);
  (IRREG[t]||[]).forEach(x=>s.add(x));
  const last=t.slice(-1), prev=t.slice(-2,-1);
  s.add(t+'s'); s.add(t+'ly');
  if (/[sxz]$|ch$|sh$/.test(t)) s.add(t+'es');
  if (last==='e'){ const st=t.slice(0,-1); s.add(st+'ing'); s.add(t+'d'); s.add(st+'ed'); }
  else { s.add(t+'ed'); s.add(t+'ing'); }
  if (last==='y' && !/[aeiou]/.test(prev)){
    const st=t.slice(0,-1); s.add(st+'ies'); s.add(st+'ied'); s.add(st+'ily');
  }
  if (/[^aeiou][aeiou][bdgklmnprt]$/.test(t)){ s.add(t+last+'ed'); s.add(t+last+'ing'); }
  s.add(t+'er'); s.add(t+'est');
  return [...s];
}

/* 하나의 표제어(단어 또는 숙어)에 대한 정규식 조각.
   숙어는 사이에 다른 단어가 최대 3개까지 끼어들어도 잡습니다. */
function termPattern(term, extra){
  const manual = String(extra||'').split(/[,\s]+/).filter(Boolean);
  const words = term.trim().split(/\s+/).filter(Boolean);
  const alt = arr => arr.map(rxEsc).sort((a,b)=>b.length-a.length).join('|');

  const core = words.map(w=>'(?:'+alt(wordForms(w))+')')
                    .join("(?:\\s+[\\w'’-]+){0,3}\\s+");
  const parts = [core];
  manual.forEach(f=>parts.push(rxEsc(f.toLowerCase())));
  return '(?:'+parts.join('|')+')';
}

/* 텍스트에 형광펜을 입힙니다. 지문과 선지 모두 이걸 씁니다. */
function highlight(text, words){
  const items = (words||[]).map((w,i)=>({i, term:(w.term||'').trim(), forms:w.forms||''}))
    .filter(o=>o.term)
    .sort((a,b)=>b.term.length-a.term.length);
  if (!items.length || !text) return esc(text||'');

  let re;
  try{
    re = new RegExp("(?<![\\w-])(" + items.map(o=>termPattern(o.term,o.forms)).join(')|(') + ")(?![\\w-])",'gi');
  }catch(e){ return esc(text); }

  let out='', last=0, m;
  while ((m=re.exec(text))!==null){
    if (m[0]===''){ re.lastIndex++; continue; }
    let gi=0;
    for (let k=1;k<m.length;k++) if (m[k]!==undefined){ gi=k-1; break; }
    out += esc(text.slice(last,m.index));
    out += '<mark class="hl" data-w="'+items[gi].i+'">'+esc(m[0])+'</mark>';
    last = m.index+m[0].length;
    if (m.index===re.lastIndex) re.lastIndex++;
  }
  out += esc(text.slice(last));
  return out;
}

function senses(w){
  if (Array.isArray(w.senses) && w.senses.length) return w.senses;
  return [{meaning:w.meaning||'', example:w.example||''}];
}

/* ================= 목록 ================= */
function allTags(){
  const s=new Set(); DB.passages.forEach(p=>(p.tags||[]).forEach(t=>s.add(t))); return [...s].sort();
}
function filtered(){
  const q=query.trim().toLowerCase();
  return DB.passages.filter(p=>{
    if (activeTag && !(p.tags||[]).includes(activeTag)) return false;
    if (!q) return true;
    if ((p.title||'').toLowerCase().includes(q)) return true;
    if ((p.body||'').toLowerCase().includes(q)) return true;
    if ((p.source||'').toLowerCase().includes(q)) return true;
    if ((p.words||[]).some(w=>
      (w.term||'').toLowerCase().includes(q) ||
      (w.syn||'').toLowerCase().includes(q) ||
      (w.ant||'').toLowerCase().includes(q) ||
      senses(w).some(s=>(s.meaning||'').toLowerCase().includes(q))
    )) return true;
    return false;
  });
}

/* ================= 뜻 입력 ================= */
function drawSenseRows(list, used){
  const box=$('senseRows');
  box.innerHTML = list.map((s,i)=>`
    <div class="sense-row">
      <label class="pick" title="지문에서 쓰인 뜻"><input type="radio" name="usedSense" value="${i}"${used===i?' checked':''}></label>
      <input class="in s-m" placeholder="뜻" value="${esc(s.meaning||'')}">
      <input class="in s-ex" placeholder="예문" value="${esc(s.example||'')}">
      <button class="ico del s-del" title="이 뜻 지우기">✕</button>
    </div>`).join('');
  box.querySelectorAll('.s-del').forEach((b,i)=>b.onclick=()=>{
    const cur=collectSenses();
    if (cur.list.length<=1){ drawSenseRows([{meaning:'',example:''}],0); return; }
    cur.list.splice(i,1);
    drawSenseRows(cur.list, Math.min(cur.used,cur.list.length-1));
  });
}
function collectSenses(){
  const rows=[...$('senseRows').querySelectorAll('.sense-row')];
  const list=rows.map(r=>({meaning:r.querySelector('.s-m').value.trim(), example:r.querySelector('.s-ex').value.trim()}));
  let used=rows.findIndex(r=>r.querySelector('input[type=radio]').checked);
  if (used<0) used=0;
  return {list,used};
}
function resetWordForm(){
  $('wTerm').value=''; $('wPos').value='n.'; $('wSyn').value=''; $('wAnt').value=''; $('wForms').value='';
  drawSenseRows([{meaning:'',example:''}],0);
  $('wSave').textContent='추가';
}
function saveWord(){
  const p=DB.passages.find(x=>x.id===currentId);
  const term=$('wTerm').value.trim();
  if (!term){ toast('단어를 입력하세요'); $('wTerm').focus(); return; }
  const c=collectSenses();
  const list=c.list.filter(s=>s.meaning||s.example);
  if (!list.length){ toast('뜻을 하나 이상 입력하세요'); return; }
  const item={term, pos:$('wPos').value, senses:list, used:Math.min(c.used,list.length-1),
              syn:$('wSyn').value.trim(), ant:$('wAnt').value.trim(), forms:$('wForms').value.trim()};
  p.words=p.words||[];
  if (editWordIdx!==null) p.words[editWordIdx]=item; else p.words.push(item);
  editWordIdx=null;
  save('단어 추가: '+term); renderSide(); renderMain();
}

  let ans=rows.findIndex(r=>r.querySelector('input[type=radio]').checked);
  return {list, ans};
}

/* ================= 지문 모달 ================= */
function openModal(id){
  editingPassageId=id||null;
  const p = id?DB.passages.find(x=>x.id===id):null;
  $('modalTitle').textContent = p?'지문 수정':'지문 추가';
  $('fTitle').value=p?p.title:''; $('fSource').value=p?(p.source||''):'';
  $('fTags').value=p?(p.tags||[]).join(', '):''; $('fBody').value=p?p.body:'';
  $('fTrans').value=p?(p.trans||''):''; $('fQ').value=p?(p.question||''):'';
  drawChoiceRows(p&&p.choices&&p.choices.length?p.choices:[], p&&Number.isInteger(p.answer)?p.answer:-1);
  $('veil').classList.add('open');
  setTimeout(()=>$('fTitle').focus(),60);
}
function closeModal(){ $('veil').classList.remove('open'); editingPassageId=null; }
$('mCancel').onclick=closeModal;
$('veil').onclick=e=>{ if (e.target===$('veil')) closeModal(); };
$('addChoice').onclick=()=>{
  const c=collectChoices(); c.list.push({text:'',trans:''});
  drawChoiceRows(c.list,c.ans);
  const rows=$('choiceRows').querySelectorAll('.c-t'); rows[rows.length-1].focus();
};
$('mSave').onclick=()=>{
  const title=$('fTitle').value.trim(), body=$('fBody').value.trim();
  if (!body){ toast('지문을 입력하세요'); $('fBody').focus(); return; }
  const tags=$('fTags').value.split(',').map(s=>s.trim()).filter(Boolean);
  const c=collectChoices();
  const choices=c.list.filter(x=>x.text||x.trans);
  const answer = (c.ans>=0 && c.ans<choices.length) ? c.ans : null;
  const data={title:title||'제목 없음', source:$('fSource').value.trim(), tags, body,
              trans:$('fTrans').value.trim(), question:$('fQ').value.trim(), choices, answer};
  if (editingPassageId){
    Object.assign(DB.passages.find(x=>x.id===editingPassageId), data);
  }else{
    const p={id:uid(), ...data, words:[], grammars:[], createdAt:Date.now()};
    DB.passages.unshift(p); currentId=p.id;
  }
  closeModal(); save(title?('지문 저장: '+title):'지문 저장'); renderSide(); renderMain();
};

/* ================= 편집 권한 ================= */
function openKey(){
  $('kOwner').value=CFG.owner; $('kRepo').value=CFG.repo;
  $('kBranch').value=CFG.branch||'main'; $('kPath').value=CFG.path||'data.json';
  $('kToken').value=CFG.token;
  $('keyVeil').classList.add('open');
}
function closeKey(){ $('keyVeil').classList.remove('open'); }
$('keyBtn').onclick=openKey;
$('kCancel').onclick=closeKey;
$('keyVeil').onclick=e=>{ if (e.target===$('keyVeil')) closeKey(); };
$('kForget').onclick=()=>{
  CFG.token=''; writeCfg(false); canEdit=false;
  document.body.classList.remove('can-edit');
  $('keyBtn').classList.remove('on'); $('keyBtn').textContent='🔒 편집';
  closeKey(); setStatus(''); renderMain(); toast('편집 권한을 껐습니다');
};
$('kSave').onclick=async ()=>{
  CFG.owner=$('kOwner').value.trim(); CFG.repo=$('kRepo').value.trim();
  CFG.branch=$('kBranch').value.trim()||'main'; CFG.path=$('kPath').value.trim()||'data.json';
  CFG.token=$('kToken').value.trim();
  if (!CFG.owner||!CFG.repo||!CFG.token){ toast('아이디 · 저장소 · 토큰을 모두 입력하세요'); return; }
  toast('확인 중…');
  if (!await verify()){ toast('접근할 수 없습니다. 토큰 권한(Contents: Read and write)을 확인하세요'); return; }
  writeCfg($('kRemember').checked);
  canEdit=true;
  document.body.classList.add('can-edit');
  $('keyBtn').classList.add('on'); $('keyBtn').textContent='🔓 편집 중';
  closeKey(); setStatus('연결됨'); renderSide(); renderMain();
};
async function verify(){
  try{
    const r=await fetch(`https://api.github.com/repos/${CFG.owner}/${CFG.repo}`,{headers:ghHeaders()});
    if (!r.ok) return false;
    const j=await r.json();
    if (!j.permissions||!j.permissions.push) return false;
    await fetchSha(); return true;
  }catch(e){ return false; }
}

/* ================= 기타 ================= */
$('exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='data.json'; a.click(); URL.revokeObjectURL(a.href);
  toast('data.json 을 내려받았습니다');
};
$('newBtn').onclick=()=>openModal(null);
$('search').oninput=e=>{ query=e.target.value; renderList(); };
$('toggleSide').onclick=()=>{
  const s=$('side'); s.classList.toggle('collapsed');
  $('toggleSide').textContent = s.classList.contains('collapsed')?'목록 펼치기':'목록 접기';
};
document.addEventListener('keydown',e=>{ if (e.key==='Escape'){ closeModal(); closeKey(); } });

/* ================= 시작 ================= */
(async function init(){
  readCfg();
  await loadData();
  if (CFG.token&&CFG.owner&&CFG.repo){
    canEdit = await verify();
    if (canEdit){
      document.body.classList.add('can-edit');
      $('keyBtn').classList.add('on'); $('keyBtn').textContent='🔓 편집 중';
    }
  }
  currentId = DB.passages[0]?DB.passages[0].id:null;
  setStatus('연결됨');
  renderSide(); renderMain();
})();
</script>
</body>
